app:
  name: Sovereign AI Workbench
  version: 0.1.0
  environment: development
  host: 0.0.0.0
  port: 8000
paths:
  data_dir: data
  uploads_dir: data/uploads
  outputs_dir: data/outputs
  logs_dir: data/logs
  models_dir: models
  knowledge_base_dir: knowledge_base
ollama:
  host: 127.0.0.1
  port: 11434
  connection_timeout_s: 10.0
  timeout_s: 120.0
  vision_timeout_s: 180.0
  max_retries: 2
  retry_backoff_s: 1.5
  cache_ttl_s: 10.0
routing:
  task_requirements:
    document:
      preferred_role: general
      capabilities:
      - reasoning
      - document_analysis
      modality: text
    coding:
      preferred_role: coding
      capabilities:
      - coding
      - debugging
      - testing
      modality: text
    vision:
      preferred_role: vision
      capabilities:
      - image_analysis
      modality: image
rag:
  chunk_size: 800
  overlap: 120
  top_k: 5
  similarity_threshold: 0.55
  collection_name: knowledge_base
  embedding:
    model_id: BAAI/bge-small-en-v1.5
    local_model_path: null
    dimension: 384
    allow_download: false
  chroma:
    persist_directory: data/chroma
    anonymized_telemetry: false
sandbox:
  image_name: sovereign-sandbox:latest
  cpu_limit: 1.0
  memory_limit: 512m
  timeout_s: 30
  network: none
  pids_limit: 64
  max_output_bytes: 1048576
agent:
  max_iterations:
    document: 4
    coding: 6
    vision: 3
ocr:
  dpi: 300
  confidence_threshold: 0.6
upload:
  max_upload_bytes: 52428800
  allowed_mime_types:
  - application/pdf
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - image/jpeg
  - image/png

sovereignty:
  poll_interval_s: 1.0
  allowlist_hosts:
  - 127.0.0.1
  - localhost
  - '::1'
  - 0.0.0.0
  allowlist_ports:
  - 11434
  - 8000
  - 5173
  docker_socket: /var/run/docker.sock
  aggregation_window_minutes: 5
